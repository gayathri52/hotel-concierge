<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOUR SEASONS ASSISTANT</title>
<style>
  :root{--ink:#1c1b19;--muted:#7a746a;--gold:#c9a96e;--bg:#f7f5f0;--card:#fff;--line:#e6e0d4}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
  header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px}
  header img{height:48px;width:auto}
  header h1{margin:0;font:500 20px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.04em;flex:1}
  header small{display:block;font:11px/1.4 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  header select{font:inherit;font-size:14px;background:#2b2a27;color:#fff;border:1px solid #4a4843;border-radius:6px;padding:7px 10px}
  #log{flex:1;overflow-y:auto;padding:24px 16px}
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .m{padding:12px 16px;border-radius:14px;max-width:88%}
  .u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
  .a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .a h3,.a h4{font:600 15px/1.3 Georgia,serif;margin:14px 0 6px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px}
  .a h3:first-child,.a h4:first-child{margin-top:0}
  .a p{margin:6px 0}.a p:first-child{margin-top:0}.a p:last-child{margin-bottom:0}
  .a ul,.a ol{margin:6px 0 8px;padding-left:20px}.a li{margin:3px 0}.a li ul{margin:2px 0}
  .a strong{font-weight:600}
  .a code{background:#f2eee6;padding:1px 5px;border-radius:4px;font-size:13px}
  .meta{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .row{display:flex;gap:10px;align-items:flex-start;align-self:flex-start;max-width:92%}
  .row .a{max-width:none;min-width:0}
  .avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;margin-top:2px}
  .avatar img{height:26px;width:auto}
  .typing{color:var(--muted);font-style:italic}
  form{border-top:1px solid var(--line);background:var(--card);padding:12px 16px}
  form .wrap{flex-direction:row;gap:10px}
  form input{flex:1;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:22px;outline:none;background:var(--bg)}
  form input:focus{border-color:var(--gold)}
  form button{font:inherit;padding:0 20px;border:0;border-radius:22px;background:var(--ink);color:#fff;cursor:pointer}
  form button:disabled{opacity:.45;cursor:default}
</style></head>

  <h1>Four Seasons <small>Concierge</small></h1>
  <select id="hotel" aria-label="Hotel">
    <option value="MTL">Montréal</option><option value="TOR">Toronto</option><option value="WHI">Whistler</option><option value="">All hotels</option>
  </select>
</header>
<div id="log"><div class="wrap" id="msgs"></div></div>
<form id="f"><div class="wrap">
  <input id="q" placeholder="Type a message" autocomplete="off" required>
  <button id="b">Send</button>
</div></form>
<script>
const WELCOME = "Welcome! Is there anything we can do to make your stay more enjoyable?";
const $ = id => document.getElementById(id);
const msgs = $('msgs'), q = $('q'), b = $('b'), hotel = $('hotel');
let history = [];

// Minimal, safe Markdown -> HTML (escapes first; headings, bold/italic/code, -, *, •, 1. lists, one nesting level)
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function md(text){
  const out=[]; let list=null, sub=null, para=[];
  const flushPara=()=>{if(para.length){out.push('<p>'+para.map(inline).join('<br>')+'</p>');para=[];}};
  const closeSub=()=>{if(sub){list.items[list.items.length-1]+='<ul>'+sub.map(i=>'<li>'+i+'</li>').join('')+'</ul>';sub=null;}};
  const closeList=()=>{if(list){closeSub();out.push(`<${list.tag}>`+list.items.map(i=>'<li>'+i+'</li>').join('')+`</${list.tag}>`);list=null;}};
  for(const raw of text.replace(/\r/g,'').split('\n')){
    const line=raw.replace(/\s+$/,''), t=line.trim();
    if(!t){flushPara();continue;}
    let m;
    if((m=t.match(/^(#{1,4})\s+(.*)$/))){flushPara();closeList();const h=m[1].length<=2?'h3':'h4';out.push(`<${h}>${inline(m[2])}</${h}>`);continue;}
    if(/^\*\*[^*]+\*\*:?$/.test(t)){flushPara();closeList();out.push('<h4>'+inline(t.replace(/^\*\*|\*\*:?$/g,''))+'</h4>');continue;}
    const indent=line.length-line.trimStart().length;
    if((m=t.match(/^([-*•·]|\d+[.)])\s+(.*)$/))){
      flushPara(); const tag=/^\d/.test(m[1])?'ol':'ul';
      if(list&&(indent>=2||(m[1]==='•'&&list.lastBullet!=='•'))){(sub=sub||[]).push(inline(m[2]));continue;}
      closeSub(); if(!list||list.tag!==tag){closeList();list={tag,items:[]};}
      list.items.push(inline(m[2])); list.lastBullet=m[1]; continue;
    }
    if(list&&indent>=2){closeSub();list.items[list.items.length-1]+='<br>'+inline(t);continue;}
    closeList(); para.push(t);
  }
  flushPara(); closeList(); return out.join('');
}

function add(cls, content, {html=false, meta=''}={}){
  const d=document.createElement('div'); d.className='m '+cls;
  if(html) d.innerHTML=content; else d.textContent=content;
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m);}
  let el=d;
  if(cls==='a'){  // assistant replies get the logo avatar
    el=document.createElement('div'); el.className='row';
    const av=document.createElement('div'); av.className='avatar';
    const img=document.createElement('img'); img.src=$('logo').src; img.alt=''; av.appendChild(img);
    el.append(av,d);
  }
  msgs.appendChild(el); $('log').scrollTop=$('log').scrollHeight; return el;
}
function reset(){history=[];msgs.innerHTML='';add('a',md(WELCOME),{html:true});}
hotel.onchange=reset; reset();

async function send(){
  const question=q.value.trim(); if(!question) return;
  q.value=''; b.disabled=true; add('u',question);
  const wait=add('a','<span class="typing">Typing…</span>',{html:true});
  try{
    const r=await fetch('ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question,hotel_id:hotel.value||null,history})});
    const j=await r.json(); wait.remove();
    if(!r.ok){add('a','Sorry, something went wrong: '+(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail)));return;}
    const tools=[...new Set(j.tools_used.map(t=>t.tool))].join(', ')||'none';
    const src=[...new Set(j.sources.map(s=>s.title||s.source))].join(' · ')||'none';
    add('a',md(j.answer),{html:true,meta:`Tools: ${tools}  ·  Sources: ${src}  ·  ${(j.latency_ms/1000).toFixed(1)}s`});
    history.push({role:'user',content:question},{role:'assistant',content:j.answer}); history=history.slice(-20);
  }catch(e){wait.remove();add('a','Sorry, something went wrong: '+e);}
  finally{b.disabled=false;q.focus();}
}
$('f').onsubmit=e=>{e.preventDefault();send();};
</script>
</body></html>
